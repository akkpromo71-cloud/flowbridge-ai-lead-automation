# Prepared production topology. Not executed/verified here; see docs/DEPLOYMENT.md.
name: flowbridge-live
x-app: &app
  build: {context: ..}
  env_file: ["${FLOWBRIDGE_APP_ENV:?absolute private app env file outside repo}"]
  environment:
    MODE: live
    SECURE_COOKIES: "true"
    N8N_BASE_URL: http://n8n:5678
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  restart: unless-stopped
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: lead_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
    volumes: ["pgdata:/var/lib/postgresql/data", "./init-live-databases.sh:/docker-entrypoint-initdb.d/10-app.sh:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lead_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logs
  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  app:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on: {app: {condition: service_healthy}, n8n: {condition: service_healthy}}
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ai_leads_n8n_live
      DB_POSTGRESDB_USER: lead_n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes: ["n8ndata:/home/node/.n8n", "${FLOWBRIDGE_WORKFLOWS:?private generated workflow directory}:/imports:ro"]
    ports: ["127.0.0.1:5681:5678"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logs
  proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes: ["./nginx.live.conf:/etc/nginx/nginx.conf:ro", "${FLOWBRIDGE_TLS_DIRECTORY:?private certificate directory}:/etc/nginx/tls:ro"]
    ports: ["80:80", "443:443"]
    depends_on: {app: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logs
volumes: {pgdata: {}, n8ndata: {}}
