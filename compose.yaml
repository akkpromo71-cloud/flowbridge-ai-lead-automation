name: ai-lead-demo
x-app: &app
  build: .
  environment: &app-env
    MODE: demo
    DATABASE_URL: postgresql+psycopg://lead_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/ai_leads_demo
    BUSINESS_CONFIG: /app/config/${BUSINESS_CONFIG_NAME:-automation}.yaml
    PUBLIC_URL: http://localhost:8080
    ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
    N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?set N8N_WEBHOOK_TOKEN}
    N8N_BASE_URL: http://n8n:5678
    SECURE_COOKIES: "false"
    ALLOW_EXTERNAL_SENDS: "false"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging: &bounded-logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    logging: *bounded-logs
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: lead_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lead_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    restart: "no"
  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      app:
        condition: service_healthy
      n8n:
        condition: service_healthy
  n8n:
    logging: *bounded-logs
    image: docker.n8n.io/n8nio/n8n:2.40.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_POOL_SIZE: "5"
      DB_POSTGRESDB_DATABASE: ai_leads_n8n
      DB_POSTGRESDB_USER: lead_n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      WEBHOOK_URL: http://n8n:5678/
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./.local/compose-workflows:/imports:ro
    ports: ["127.0.0.1:5681:5678"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  proxy:
    logging: *bounded-logs
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  n8ndata:
