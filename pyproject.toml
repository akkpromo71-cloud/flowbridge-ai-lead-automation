[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lead-automation"
version = "0.1.0"
description = "Single-company lead intake, review and controlled communication"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.140.13", "pydantic==2.13.5", "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.54", "alembic==1.19.2", "psycopg[binary]==3.3.6",
  "httpx==0.28.1", "openai==3.19.2", "uvicorn==0.52.4",
  "pwdlib[argon2]==0.3.1", "PyYAML==6.0.3", "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["postgres: requires an isolated PostgreSQL test database", "live: explicit external API test"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
